<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1872"/>
      <stop offset="100%" stop-color="#160e29"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8deff"/>
      <stop offset="100%" stop-color="#a865ff"/>
    </linearGradient>
  </defs>
  <!-- Full circle background with generous 6px internal margin so nothing clips -->
  <circle cx="50" cy="50" r="44" fill="url(#bgGrad)" stroke="#8a3ffc" stroke-width="2.5"/>
  <!-- Head: proportional and centered -->
  <circle cx="50" cy="38" r="14" fill="url(#userGrad)"/>
  <!-- Body: smooth rounded torso fitting comfortably inside circle without touching edge -->
  <path d="M 28 72 C 28 58, 38 53, 50 53 C 62 53, 72 58, 72 72 C 72 76, 68 78, 50 78 C 32 78, 28 76, 28 72 Z" fill="url(#userGrad)"/>
</svg>
